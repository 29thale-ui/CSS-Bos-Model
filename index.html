<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Box Model Practice</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <!-- Wrap the below headings in a div with the id "present-stack" -->
    <h3 id="top">Small Present</h3>
    <h2 id="middle">Medium Present</h2>
    <h1 id="bottom">Large Present</h1>

    <!-- Wrap the below h1's in a div with the id name "flex" -->
    <h1>This one</h1>
    <h1>This one is next to</h1>

    <!--Wrap the following headings in nested divs so that they create a Russian nesting doll style box layout. Give your outside div the id "outer-box". Give your inside divs both the class "inner-box". -->
    <h1>Large Doll</h1>
    <h2>Medium Doll</h2>
    <h3>Small Doll</h3>
  </body>
</html>
